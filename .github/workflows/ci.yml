name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install (core + dev)
        # heavy ML deps (torch/lightgbm/cvxpy) are exercised only in downstream phases;
        # CI installs the package + dev tools and runs the Phase-0/contract test suite.
        run: |
          uv pip install --system numpy pandas pyarrow scipy scikit-learn statsmodels \
            PyWavelets pyyaml requests pytest hypothesis ruff
          uv pip install --system -e . --no-deps
      - name: Lint
        run: ruff check src tests || true
      - name: Test
        run: pytest -q
